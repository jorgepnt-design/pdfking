name: CoroaPDF Android erstellen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Einmaligen Upload-Schlüssel erzeugen
        shell: bash
        run: |
          PASSWORD="$(openssl rand -base64 32 | tr -d '\n' | tr '/+' 'ab')"
          echo "::add-mask::$PASSWORD"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/coroapdf-upload.jks" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias coroapdf-upload \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=CoroaPDF, OU=Android, O=Jorge Pinto, C=DE"
          {
            echo "Diesen Schlüssel und dieses Passwort sicher aufbewahren."
            echo "Alias: coroapdf-upload"
            echo "Passwort: $PASSWORD"
          } > "$RUNNER_TEMP/CoroaPDF-Schluessel-Passwort.txt"
          echo "COROAPDF_KEYSTORE=$RUNNER_TEMP/coroapdf-upload.jks" >> "$GITHUB_ENV"
          echo "COROAPDF_STORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "COROAPDF_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "COROAPDF_KEY_ALIAS=coroapdf-upload" >> "$GITHUB_ENV"

      - name: Signiertes Android App Bundle bauen
        working-directory: android
        run: gradle --no-daemon bundleRelease

      - name: Play-Store-Paket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: CoroaPDF-PlayStore-v1
          retention-days: 30
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/coroapdf-upload.jks
            ${{ runner.temp }}/CoroaPDF-Schluessel-Passwort.txt
