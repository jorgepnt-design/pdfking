name: CoroaPDF Android erstellen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Gesicherten Upload-Schlüssel laden
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.COROAPDF_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.COROAPDF_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.COROAPDF_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COROAPDF_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "GitHub-Schlüssel COROAPDF_KEYSTORE_BASE64 fehlt."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coroapdf-upload.jks"
          echo "COROAPDF_KEYSTORE=$RUNNER_TEMP/coroapdf-upload.jks" >> "$GITHUB_ENV"
          echo "COROAPDF_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "COROAPDF_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "COROAPDF_KEY_ALIAS=${KEY_ALIAS:-coroapdf-upload}" >> "$GITHUB_ENV"

      - name: Signiertes Android App Bundle bauen
        working-directory: android
        run: gradle --no-daemon bundleRelease

      - name: Play-Store-Paket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: CoroaPDF-PlayStore-v2
          retention-days: 30
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
